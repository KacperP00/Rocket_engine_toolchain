%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Supersonic Rocket Nozzle (Euler Test)                      %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= EULER
MATH_PROBLEM= DIRECT
AXISYMMETRIC= YES

% ------------------------- FREE-STREAM DEFINITION ----------------------------%
MACH_NUMBER= 0.01
AOA= 0.0
FREESTREAM_PRESSURE= 10000.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 1e6
REYNOLDS_LENGTH= 1.0

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= {GAMMA}
GAS_CONSTANT= {R}

% --------------------------- VISCOSITY MODEL ---------------------------------%
% Deklaracja właściwości transportowych dla spalin Cantery
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= {MU}
CONDUCTIVITY_MODEL= CONSTANT_CONDUCTIVITY
PRANDTL_LAM= {PRANDTL}
PRANDTL_TURB= 0.90

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
MARKER_SYM= ( MARKER_SYM )
MARKER_EULER= ( MARKER_WALL )
MARKER_INLET= ( MARKER_INLET, {T_C}, {P_C}, 1.0, 0.0, 0.0 )
MARKER_SUPERSONIC_OUTLET= ( MARKER_OUTLET )

% ------------------------ SURFACES IDENTIFICATION ----------------------------%
MARKER_PLOTTING= ( MARKER_WALL )
MARKER_MONITORING= ( MARKER_WALL, MARKER_INLET, MARKER_OUTLET )

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= nozzle.su2
MESH_FORMAT= SU2
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= CSV

% ----------------------- NUMERICAL METHOD DEFINITION -------------------------%
CONV_NUM_METHOD_FLOW= AUSM
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 1.0
CFL_ADAPT= NO

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
ITER= 4000
CONV_RESIDUAL_MINVAL= -8