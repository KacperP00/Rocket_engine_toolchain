%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file - Supersonic Rocket Nozzle (RANS SST)                 %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
AXISYMMETRIC= YES

% ------------------------- FREE-STREAM DEFINITION ----------------------------%
MACH_NUMBER= 0.01
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 10000.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 1e6
REYNOLDS_LENGTH= 1.0

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= {GAMMA}
GAS_CONSTANT= {R}

% --------------------------- VISCOSITY MODEL ---------------------------------%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= {MU}
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= {PRANDTL}
PRANDTL_TURB= 0.90

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
MARKER_SYM= ( MARKER_SYM )
MARKER_HEATFLUX= ( MARKER_WALL, 0.0 )
MARKER_INLET= ( MARKER_INLET, {T_C}, {P_C}, 1.0, 0.0, 0.0 )
MARKER_SUPERSONIC_OUTLET= ( MARKER_OUTLET )

% ------------------------ SURFACES IDENTIFICATION ----------------------------%
MARKER_PLOTTING= ( MARKER_WALL )
MARKER_MONITORING= ( MARKER_WALL, MARKER_INLET, MARKER_OUTLET )

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= nozzle.su2
MESH_FORMAT= SU2
OUTPUT_FILES= (RESTART, RESTART_ASCII, PARAVIEW, SURFACE_CSV)
OUTPUT_WRT_FREQ= 250
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
RESTART_FILENAME= restart
SOLUTION_FILENAME= solution
TABULAR_FORMAT= CSV

% ----------------------- NUMERICAL METHOD DEFINITION -------------------------%
CONV_NUM_METHOD_FLOW= AUSM
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.5
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.2, 0.01, 5.0 )

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
ITER= 2000
CONV_RESIDUAL_MINVAL= -8