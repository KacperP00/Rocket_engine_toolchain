%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Supersonic Rocket Nozzle (Euler)                           %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= EULER
MATH_PROBLEM= DIRECT
AXISYMMETRIC= YES

% ------------------------- FREE-STREAM DEFINITION ----------------------------%
% Warunki początkowe (inicjalizacja domeny). Zostawiamy niskiego Macha
MACH_NUMBER= 0.01
AOA= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
% TUTAJ PYTHON WKLEI WYNIKI Z CANTERY
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= {GAMMA}
GAS_CONSTANT= {R}

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X = 0.00
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
% MARKERY MUSZĄ PASOWAĆ DO NAZW Z GMSH

% Oś symetrii
MARKER_SYM= ( MARKER_SYM )

% Ścianka dyszy (Euler - brak lepkości, tzw. slip wall)
MARKER_EULER= ( MARKER_WALL )

% Wlot z komory spalania (Total Temperature, Total Pressure, kierunek przepływu)
% TUTAJ PYTHON WKLEI WYNIKI Z CANTERY
MARKER_INLET= ( MARKER_INLET, {T_C}, {P_C}, 1.0, 0.0, 0.0 )

% Wylot naddźwiękowy (wartości ekstrapolowane z wnętrza domeny)
MARKER_SUPERSONIC_OUTLET= ( MARKER_OUTLET )

% ------------------------ SURFACES IDENTIFICATION ----------------------------%
MARKER_PLOTTING= ( MARKER_WALL )
MARKER_MONITORING= ( MARKER_WALL, MARKER_INLET, MARKER_OUTLET )

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= nozzle.su2
MESH_FORMAT= SU2

% Format wyjściowy (Paraview/VTK)
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_CSV)
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= CSV

% ----------------------- NUMERICAL METHOD DEFINITION -------------------------%
CONV_NUM_METHOD_FLOW= JST
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 1.0, 100.0 )

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
ITER= 300
CONV_RESIDUAL_MINVAL= -8